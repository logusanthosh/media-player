<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f7f5">
    <meta name="description" content="SONIQ — your local videos, beautifully simple.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icon.svg">
    <link rel="stylesheet" href="./video.css">
    <title>SONIQ — Local video player</title>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <a class="brand" href="./" aria-label="SONIQ home"><span class="brand-icon">▶</span>SONIQ</a>
        <nav class="main-nav" aria-label="Main navigation">
          <button class="nav-link active" data-view="videos">Videos</button>
          <button class="nav-link" data-view="audio">Audio</button>
          <button class="nav-link" data-view="recent">Recently played</button>
        </nav>
        <div class="header-actions">
          <label class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search your library" aria-label="Search your library" autocomplete="off"></label>
          <button id="open-files" class="button button-primary"><span aria-hidden="true">＋</span><span class="open-label">Open files</span></button>
          <button id="install-button" class="button button-light" hidden>Install</button>
        </div>
      </header>
      <main id="main-content" class="main-content"></main>
      <footer id="audio-dock" class="audio-dock" hidden>
        <div class="dock-track"><span class="dock-icon">♫</span><span><b id="dock-title">Choose a track</b><small id="dock-artist">Local audio</small></span></div>
        <div class="dock-controls"><button id="audio-previous" class="icon-button" aria-label="Previous audio">⏮</button><button id="audio-play" class="dock-play" aria-label="Play audio">▶</button><button id="audio-next" class="icon-button" aria-label="Next audio">⏭</button></div>
        <div class="dock-progress"><span id="audio-current">0:00</span><input id="audio-seek" type="range" min="0" max="1000" value="0" aria-label="Audio position"><span id="audio-duration">0:00</span></div>
        <div class="dock-volume"><button id="audio-mute" class="icon-button" aria-label="Mute audio">◖</button><input id="audio-volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Audio volume"></div>
      </footer>
    </div>

    <dialog id="video-player" class="video-dialog">
      <div class="video-stage" id="video-stage">
        <video id="video-element" playsinline preload="metadata"></video>
        <div class="video-message" id="video-message" hidden></div>
        <button id="video-close" class="player-close" aria-label="Close video">×</button>
        <div id="video-controls" class="video-controls">
          <div class="video-title">
            <span id="video-name">Video</span>
            <span class="video-spacer"></span>
          </div>
          <div class="video-center-controls">
            <button id="video-back" class="control-button skip-button" aria-label="Back 10 seconds">↶<small>10</small></button>
            <button id="video-play" class="video-play" aria-label="Play">▶</button>
            <button id="video-forward" class="control-button skip-button" aria-label="Forward 10 seconds">↷<small>10</small></button>
          </div>
          <div class="video-timeline">
            <span id="video-current">0:00</span>
            <input id="video-seek" type="range" min="0" max="1000" value="0" aria-label="Video position">
            <span id="video-duration">0:00</span>
          </div>
          <div class="video-bottom-controls">
            <button id="video-previous" class="control-button" aria-label="Previous video" title="Previous video">⏮</button>
            <button id="video-next" class="control-button" aria-label="Next video" title="Next video">⏭</button>
            <button id="video-mute" class="control-button" aria-label="Mute video" title="Mute video">◖</button>
            <input id="video-volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Video volume">
          </div>
        </div>
      </div>
      <section class="video-settings" aria-label="Video settings">
        <div class="video-settings-group" aria-label="Display">
          <div class="rotation-controls" aria-label="Rotate video">
            <span class="option-label">Rotate</span>
            <button id="rotate-counterclockwise" class="control-button" aria-label="Rotate 90 degrees counterclockwise" title="Rotate 90° counterclockwise">↶</button>
            <button id="rotate-reset" class="control-button reset-rotation" aria-label="Reset video rotation" title="Reset rotation">0°</button>
            <button id="rotate-clockwise" class="control-button" aria-label="Rotate 90 degrees clockwise" title="Rotate 90° clockwise">↷</button>
          </div>
          <label class="video-option">Aspect
            <select id="video-aspect" aria-label="Video aspect ratio">
              <option value="auto">Auto</option>
              <option value="16:9">16:9</option>
              <option value="4:3">4:3</option>
            </select>
          </label>
          <button id="video-fit" class="video-fit-button" aria-label="Video display Fit">Fit</button>
          <label class="video-option speed-option">Speed
            <select id="video-speed" aria-label="Playback speed">
              <option value="0.5">0.5×</option>
              <option value="1" selected>1×</option>
              <option value="1.25">1.25×</option>
              <option value="1.5">1.5×</option>
              <option value="2">2×</option>
            </select>
          </label>
        </div>
        <div class="video-settings-group" aria-label="Player options">
          <button id="landscape-button" class="control-button labeled-control" aria-label="Landscape fullscreen" title="Landscape fullscreen"><span aria-hidden="true">▱</span><span>Landscape</span></button>
          <button id="pip-button" class="control-button labeled-control" aria-label="Picture in picture" title="Picture in picture"><span aria-hidden="true">▣</span><span>Picture in picture</span></button>
          <button id="fullscreen-button" class="control-button labeled-control" aria-label="Fullscreen" title="Fullscreen"><span aria-hidden="true">⛶</span><span>Fullscreen</span></button>
        </div>
      </section>
    </dialog>

    <dialog id="playlist-dialog" class="small-dialog">
      <form method="dialog" class="dialog-close"><button class="icon-button" aria-label="Close">×</button></form>
      <form id="playlist-form" class="dialog-content">
        <p class="overline">AUDIO PLAYLIST</p><h2 id="playlist-dialog-title">New playlist</h2>
        <label for="playlist-name">Name</label><input id="playlist-name" maxlength="48" required placeholder="Evening mix">
        <div class="dialog-actions"><button type="button" id="playlist-cancel" class="button button-light">Cancel</button><button class="button button-primary" type="submit">Save</button></div>
      </form>
    </dialog>
    <dialog id="confirm-dialog" class="small-dialog">
      <div class="dialog-content"><p class="overline">AUDIO PLAYLIST</p><h2 id="confirm-title">Are you sure?</h2><p id="confirm-copy" class="confirm-copy"></p><div class="dialog-actions"><button type="button" id="confirm-cancel" class="button button-light">Cancel</button><button type="button" id="confirm-accept" class="button button-primary">Delete</button></div></div>
    </dialog>

    <input id="media-input" type="file" accept="video/*,audio/*,.mp4,.webm,.mov,.mkv,.avi,.m4v,.3gp,.ogv,.mpg,.mpeg,.mp3,.wav,.flac,.aac,.m4a,.ogg" multiple hidden>
    <input id="folder-input" type="file" accept="video/*,audio/*" webkitdirectory multiple hidden>
    <audio id="audio-element" preload="metadata"></audio>
    <script type="module" src="./src/video-app.js"></script>
  </body>
</html>
