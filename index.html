<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="SONIQ — your local videos, beautifully simple.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icon.svg">
    <link rel="stylesheet" href="./video.css">
    <title>SONIQ — Local video player</title>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <a class="brand" href="./" aria-label="SONIQ home"><span class="brand-icon">▶</span>SONIQ</a>
        <nav class="main-nav" aria-label="Main navigation">
          <button class="nav-link active" data-view="videos">Videos</button>
          <button class="nav-link" data-view="audio">Audio</button>
          <button class="nav-link" data-view="recent">Recently played</button>
        </nav>
        <div class="header-actions">
          <label class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search your library" aria-label="Search your library" autocomplete="off"></label>
          <button id="open-files" class="button button-primary"><span aria-hidden="true">＋</span><span class="open-label">Open files</span></button>
          <button id="install-button" class="button button-light" hidden>Install</button>
        </div>
      </header>
      <main id="main-content" class="main-content"></main>
      <footer id="audio-dock" class="audio-dock" hidden>
        <div class="dock-track"><span class="dock-icon">♫</span><span><b id="dock-title">Choose a track</b><small id="dock-artist">Local audio</small></span></div>
        <div class="dock-controls"><button id="audio-previous" class="icon-button" aria-label="Previous audio">⏮</button><button id="audio-play" class="dock-play" aria-label="Play audio">▶</button><button id="audio-next" class="icon-button" aria-label="Next audio">⏭</button></div>
        <div class="dock-progress"><span id="audio-current">0:00</span><input id="audio-seek" type="range" min="0" max="1000" value="0" aria-label="Audio position"><span id="audio-duration">0:00</span></div>
        <div class="dock-volume"><button id="audio-mute" class="icon-button" aria-label="Mute audio">◖</button><input id="audio-volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Audio volume"></div>
      </footer>
    </div>

    <dialog id="video-player" class="video-dialog">
      <header class="player-header">
        <button id="video-close" class="player-back" aria-label="Back to library" title="Back to library">←</button>
        <span id="video-name" class="player-filename">Video</span>
      </header>
      <div class="video-stage" id="video-stage">
        <video id="video-element" playsinline preload="metadata"></video>
        <div class="video-message" id="video-message" hidden></div>
        <button id="fullscreen-exit" class="fullscreen-exit" aria-label="Exit fullscreen">Exit fullscreen</button>
      </div>
      <section id="video-controls" class="player-controls" aria-label="Video playback controls">
        <div class="video-timeline">
          <span id="video-current">0:00</span>
          <input id="video-seek" type="range" min="0" max="1000" value="0" aria-label="Video position">
          <span id="video-remaining">-0:00</span>
        </div>
        <div class="player-control-row">
          <div class="video-transport">
            <button id="video-previous" class="player-button" aria-label="Previous video" title="Previous video">|◀</button>
            <button id="video-play" class="player-play" aria-label="Play">▶</button>
            <button id="video-next" class="player-button" aria-label="Next video" title="Next video">▶|</button>
          </div>
          <div class="player-utilities">
            <button id="lock-screen-button" class="player-button utility-button" aria-label="Enable lock screen controls" aria-pressed="false">Lock Screen Controls</button>
            <button id="fullscreen-button" class="player-button" aria-label="Enter fullscreen" title="Fullscreen">⛶</button>
            <button id="video-options-toggle" class="player-button" aria-expanded="false" aria-controls="video-options" aria-label="Show player options">Options</button>
          </div>
        </div>
        <div id="video-options" class="video-options" aria-label="Player options" hidden>
          <button id="night-mode-button" class="option-button" data-video-option="night-mode" aria-pressed="false">Night Mode</button>
          <button id="customise-items-button" class="option-button" data-video-option="customise-items">Customise Items</button>
          <button id="sleep-timer-button" class="option-button" data-video-option="sleep-timer">Sleep Timer</button>
          <label class="option-button speed-option" data-video-option="playback-speed">Playback Speed
            <select id="video-speed" aria-label="Playback speed">
              <option value="0.5">0.5×</option>
              <option value="0.75">0.75×</option>
              <option value="1" selected>1×</option>
              <option value="1.25">1.25×</option>
              <option value="1.5">1.5×</option>
              <option value="2">2×</option>
            </select>
          </label>
          <button id="screenshot-button" class="option-button" data-video-option="screenshot">Screenshot</button>
          <button id="background-play-button" class="option-button" data-video-option="background-play" aria-pressed="false">Background Play</button>
          <button id="rotation-button" class="option-button" data-video-option="screen-rotation" aria-label="Rotate video 90 degrees">Screen Rotation</button>
        </div>
      </section>
    </dialog>

    <aside id="video-background-dock" class="video-background-dock" hidden aria-label="Background video playback">
      <span id="video-background-title">Video playing in background</span>
      <button id="video-background-return" class="small-action">Return to video</button>
      <button id="video-background-stop" class="small-action">Stop</button>
    </aside>

    <dialog id="customise-dialog" class="small-dialog">
      <form id="customise-form" class="dialog-content">
        <h2>Customise Items</h2>
        <p class="dialog-help">Choose which options appear in the player menu. Customise Items will always stay available.</p>
        <div id="customise-items-list" class="customise-items-list"></div>
        <div class="dialog-actions">
          <button type="button" id="customise-cancel" class="button button-light">Cancel</button>
          <button class="button button-primary" type="submit">Save items</button>
        </div>
      </form>
    </dialog>
    <dialog id="sleep-timer-dialog" class="small-dialog">
      <form id="sleep-timer-form" class="dialog-content">
        <h2>Sleep Timer</h2>
        <label for="sleep-timer-duration">Stop playback after</label>
        <select id="sleep-timer-duration">
          <option value="0">Off</option>
          <option value="15">15 minutes</option>
          <option value="30">30 minutes</option>
          <option value="45">45 minutes</option>
          <option value="60">60 minutes</option>
          <option value="90">90 minutes</option>
        </select>
        <div class="dialog-actions">
          <button type="button" id="sleep-timer-cancel" class="button button-light">Cancel</button>
          <button class="button button-primary" type="submit">Set timer</button>
        </div>
      </form>
    </dialog>

    <dialog id="playlist-dialog" class="small-dialog">
      <form method="dialog" class="dialog-close"><button class="icon-button" aria-label="Close">×</button></form>
      <form id="playlist-form" class="dialog-content">
        <p class="overline">AUDIO PLAYLIST</p><h2 id="playlist-dialog-title">New playlist</h2>
        <label for="playlist-name">Name</label><input id="playlist-name" maxlength="48" required placeholder="Evening mix">
        <div class="dialog-actions"><button type="button" id="playlist-cancel" class="button button-light">Cancel</button><button class="button button-primary" type="submit">Save</button></div>
      </form>
    </dialog>
    <dialog id="confirm-dialog" class="small-dialog">
      <div class="dialog-content"><p class="overline">AUDIO PLAYLIST</p><h2 id="confirm-title">Are you sure?</h2><p id="confirm-copy" class="confirm-copy"></p><div class="dialog-actions"><button type="button" id="confirm-cancel" class="button button-light">Cancel</button><button type="button" id="confirm-accept" class="button button-primary">Delete</button></div></div>
    </dialog>

    <input id="media-input" type="file" accept="video/*,audio/*,.mp4,.webm,.mov,.mkv,.avi,.m4v,.3gp,.ogv,.mpg,.mpeg,.mp3,.wav,.flac,.aac,.m4a,.ogg" multiple hidden>
    <input id="folder-input" type="file" accept="video/*,audio/*" webkitdirectory multiple hidden>
    <audio id="audio-element" preload="metadata"></audio>
    <script type="module" src="./src/video-app.js"></script>
  </body>
</html>
